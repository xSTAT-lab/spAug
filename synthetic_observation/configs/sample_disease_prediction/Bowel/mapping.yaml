spatial_resampling:
  sigma_factor: 0.08
  min_sigma: 1.0e-6
  random_seed: 42

knn_mapping:
  k: 10
  metric: cosine
  feature_source: hvg
  pca_n_components: 50
  aggregation: mean

spatial_perturbation:
  base_method: knn_mapping
  sigma_factor: 1.0
  random_seed: 42
  check_overlap: true
  min_distance_ratio: 0.5
  max_resample: 10

gmm_sampling:
  n_components: 10
  covariance_type: full
  sampling_mode: low_density
  density_threshold: 0.3
  random_seed: 42
  snap_to_tissue: false

coordinate_system:
  coord_key: spatial
  flip_y: false
