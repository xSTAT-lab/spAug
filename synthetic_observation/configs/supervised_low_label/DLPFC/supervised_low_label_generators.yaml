# DLPFC supervised low-label generation overrides.
#
# This file is used only by src/02_generators/supervised_low_label/DLPFC/generate.py.
# Spatial-clustering generation keeps its configuration in its dedicated file.

SRTsim:
  maxiter: 120
  min_nonzero: 1
  coord_sigma_factor: 0.08

Splatter:
  n_regions: 5
  min_region_size: 8
  coord_sigma_factor: 0.12

SPARsim:
  n_regions: 5
  min_region_size: 8
  coord_sigma_factor: 0.10

scGAN:
  epochs: 150
  batch_size: 64
  generate_batch_size: 512
  latent_dim: 64
  lr_gen: 0.0001
  lr_dis: 0.0001
  n_critic: 2
  lambda_gp: 5.0
  lr_decay: true
  lr_final: 0.00002
  use_lsn: false

scDiffusion:
  epochs: 120
  batch_size: 64
  generate_batch_size: 256
  lr: 0.0002
  n_timesteps: 200
  use_vae: false
  vae_epochs: 50
  vae_latent_dim: 64
  use_ddim: true
