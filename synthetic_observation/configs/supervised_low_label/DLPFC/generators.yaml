# ============================================================
# Generator configuration
# Core hyperparameters are listed here; training logic lives in each model module
# ============================================================

# ----- Generators that produce coordinates -----

SRTsim:
  model_type: statistical_simulation # statistical simulator
  has_coords: true
  # SRTsim parameters
  n_components: 10                  # number of mixture components
  simulation_method: "mixture"      # simulation strategy
  n_generate_ratio: 1.0
  random_seed: 42

Splatter:
  model_type: regional_negative_binomial
  has_coords: true
  # Python implementation of SpatialSimBench simAdaptor + Splatter idea:
  # cluster each slice spatially, then fit/generate expression within regions.
  n_regions: 7
  region_method: "spatial_kmeans"
  min_region_size: 20
  dispersion_min: 0.01
  dispersion_max: 1000000.0
  dropout_match: true
  library_size_match: true
  coord_sigma_factor: 0.15
  n_generate_ratio: 1.0
  random_seed: 42

SPARsim:
  model_type: regional_sparsim
  has_coords: true
  # Python implementation of SpatialSimBench simAdaptor + SPARsim idea:
  # estimate normalized expression, size factors, dispersion, and dropout per
  # spatial region, then sample count data back onto regional coordinates.
  n_regions: 7
  region_method: "spatial_kmeans"
  min_region_size: 20
  dispersion_min: 0.01
  dispersion_max: 1000000.0
  dropout_quantile: 0.99
  coord_sigma_factor: 0.12
  n_generate_ratio: 1.0
  random_seed: 42

# ----- Coordinate-free generators use the assignment policy below -----

scDiffusion:
  model_type: diffusion              # diffusion model
  has_coords: false                  # no coordinates; assign proxy coordinates with the mapping module
  # diffusion parameters
  n_timesteps: 1000
  beta_schedule: "linear"
  hidden_dim: [512, 512, 256, 128]
  classifier_hidden_dim: [512, 512, 256, 128]
  n_layers: 4
  lr: 0.0001
  epochs: 1000
  batch_size: 128
  # VAE preprocessing (the reference workflow trains a VAE before diffusion)
  use_vae: true
  vae_latent_dim: 128
  vae_epochs: 200
  vae_lr: 0.0005
  vae_hidden_dim: [1024, 1024, 1024]
  postprocess_gene_quantile: 0.999
  postprocess_library_quantile: 0.995
  n_generate_ratio: 1.0

scGAN:
  model_type: gan                    # generative adversarial network
  has_coords: false
  # GAN parameters
  latent_dim: 128
  conditional_gan: true              # enable cscGAN-style internal conditioning when a condition column has at least two classes
  condition_dim: 32
  gen_hidden: [256, 512]
  dis_hidden: [512, 256]
  lr_gen: 0.0002                     # initial learning rate (alpha_0)
  lr_dis: 0.0002
  n_critic: 5                       # critic updates per WGAN-GP step
  lambda_gp: 10.0                   # gradient penalty coefficient
  use_lsn: false                    # Library Size Normalization (reference output_LSN=20000)
  lr_decay: false                   # exponential learning-rate decay (reference decay=true)
  lr_final: null                    # final learning rate (alpha_final, null=lr_gen*0.1)
  epochs: 500
  batch_size: 128
  n_generate_ratio: 1.0

# ----- Global settings -----

global:
  random_seed: 42
  device: "cuda"                    # cuda / cpu
  # use the number of HVGs as the input feature dimension
  use_hvg: true
