# ============================================================
# DLPFC unsupervised spatial-clustering configuration
# ============================================================

task3_spatial_cluster:
  datasets:
    - DLPFC

  # The primary line uses pca_spatial_leiden with seed 42.
  clustering:
    algorithm: "leiden"
    backend: "pca_spatial_leiden"
    backends: ["pca_spatial_leiden"]
    resolution: 1.0
    random_seed: 42
    seeds: [42]
    pca_n_components: 50
    spatial_weight: 1.0
    knn_backend: "torch_cuda"
    torch_knn_chunk_size: 1024
    n_clusters_by_slice:
      "151507": 7
      "151508": 7
      "151509": 7
      "151510": 7
      "151669": 5
      "151670": 5
      "151671": 5
      "151672": 5
      "151673": 7
      "151674": 7
      "151675": 7
      "151676": 7

  ablation:
    path_B:
      name: "post_cluster_label_removal"
      description: "remove synthetic spot labels after clustering and retain real-spot clustering results"
      remove_synthetic_after: true

  metrics: ["ari", "nmi", "ami", "homogeneity", "completeness", "v_measure", "fowlkes_mallows"]

global:
  random_seed: 42
  n_jobs: 4
  results_dir: "data/05_results/spatial_cluster/DLPFC"
  summary_dir: "data/05_results/summary/spatial_cluster/DLPFC"
  figures_dir: "data/05_results/figures/spatial_cluster/DLPFC"
